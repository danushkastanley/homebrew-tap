name: Tests

# Installs the formula from this tap on macOS and Linux, and checks that the
# committed formula is what the signed release renders to.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Install on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Set up Homebrew with this tap
        uses: Homebrew/actions/setup-homebrew@9adaf5f919d8bcadd00012733acf8d50319d25e3 # main on 26 November 2026
      - name: Check style
        run: brew style danushkastanley/tap
      - name: Install
        run: brew install danushkastanley/tap/kubectl-memlens
      - name: Run the formula test
        run: brew test danushkastanley/tap/kubectl-memlens
      - name: Audit
        run: brew audit --formula danushkastanley/tap/kubectl-memlens

  rendered:
    name: Formula matches the signed release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.2
      - name: Render the committed version again and compare
        run: python3 scripts/update_formula.py --check
